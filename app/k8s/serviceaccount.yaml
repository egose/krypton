# Identity Krypton uses to talk to the API server.
# The token is auto-mounted at /var/run/secrets/kubernetes.io/serviceaccount/token
# and the app targets https://kubernetes.default.svc — no credentials to manage.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: krypton
  namespace: krypton
  labels:
    app.kubernetes.io/name: krypton
