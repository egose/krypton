# Sensitive values — replace placeholders before applying.
# kubectl create secret generic krypton-oidc -n krypton \
#   --from-literal=OIDC_CLIENT_SECRET='...' \
#   --from-literal=SESSION_SECRET="$(openssl rand -hex 32)" --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: krypton-oidc
  namespace: krypton
  labels:
    app.kubernetes.io/name: krypton
stringData:
  OIDC_CLIENT_SECRET: CHANGE-ME # pragma: allowlist secret
  SESSION_SECRET: CHANGE-ME-min-32-chars________________________________ # pragma: allowlist secret
