# Default values for _.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  env: {}
  podAnnotations: {}
  imagePullSecrets: []
  serviceAccountName: ''

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: ghcr.io/egose/krypton
  tag: latest
  pullPolicy: Always

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: app
fullnameOverride: app

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Krypton talks to the Kubernetes API with its own ServiceAccount token, so
  # the token MUST be auto-mounted (unlike apps that set this to false).
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ''

serviceAccountName:

# Optional extra CLI args for the container.
args: []

envSecretName: ''
env: {}

# Inject POD_NAMESPACE from the downward API (metadata.namespace). Krypton
# resolves its own namespace as POD_NAMESPACE, then KRYPTON_NAMESPACE, then
# 'krypton' (see app/lib/config.ts); namespace scope requires this.
podNamespaceEnv: true

# Additional raw env entries appended after `env` (e.g. valueFrom sources).
extraEnv: []
# - name: POD_IP
#   valueFrom:
#     fieldRef:
#       fieldPath: status.podIP

# Kubernetes RBAC for the app ServiceAccount (see app/k8s/role.yaml and
# app/k8s/clusterrole.yaml). Must match KRYPTON_SCOPE in `env`: `namespace`
# manages secrets in its own namespace(s) only, `cluster` is a centralized
# multi-namespace dashboard (optionally narrowed with KRYPTON_NAMESPACES).
rbac:
  create: true
  scope: namespace
  # Extra namespaces to bind the namespaced Role into (a Role + RoleBinding
  # pair is rendered per entry, subject stays this release's ServiceAccount).
  # Only used when scope is `namespace`.
  extraNamespaces: []
  # - team-a

# Namespace-level ownership fallback ConfigMap (key `access.json`, see
# app/k8s/configmap-access.yaml). Per-secret annotations override these rules.
# The name must match KRYPTON_ACCESS_CONFIGMAP in `env`.
accessConfig:
  enabled: false
  name: krypton-access
  key: access.json
  data: {}
  # data:
  #   production:
  #     groups: [dev-team, database-admins]
  #     users: [alice@company.com]

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  # krypton images run as non-root user 65532 (see /Dockerfile).
  runAsUser: 65532

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  # krypton's Next.js standalone server listens on 3000 by default; the
  # deployment passes this value as the PORT env var so the two cannot drift.
  port: 3000

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ''
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
  - host: chart-example.local
    paths:
    - path: /
      pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

route:
  enabled: false
  host:

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
  - chart-example.local
  # List of rules and filters applied.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
# /api/config is an unauthenticated endpoint that answers without touching the
# Kubernetes API or OIDC discovery, so it is safe to probe (see app/k8s/deployment.yaml).
livenessProbe:
  httpGet:
    path: /api/config
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
readinessProbe:
  httpGet:
    path: /api/config
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
startupProbe: {}

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: ''

topologySpreadConstraints: []

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
