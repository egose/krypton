# kind cluster for Krypton sandbox testing.
# Created by `make kind-up` (name passed via --name, default krypton-sandbox).
# No port mappings needed: the app talks to the API server through the kind
# kubeconfig entry (localhost:6443), and Dex runs host-side via compose.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
- role: worker
