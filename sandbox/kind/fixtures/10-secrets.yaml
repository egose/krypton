---
# Sandbox secret fixtures — one per authorization case (values are fake).
# Expected visibility (see ../README.md matrix):
#   database-credentials  secret-level rules (dev-team)            alice/admin only
#   feature-flags         no rules anywhere (open by default)      everyone
#   legacy-external       unmanaged, no krypton annotations        everyone + "external" badge
#   frontend-api-keys     no secret rules -> namespace fallback    carol/admin only
apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
  namespace: krypton-test
  annotations:
    krypton.io/managed-by: krypton
    krypton.io/version: '1'
    krypton.io/description: Sandbox Postgres credentials (fake)
    krypton.io/allowed-groups: dev-team, database-admins
  labels:
    app.kubernetes.io/part-of: krypton-sandbox
type: Opaque
stringData:
  username: sandbox-app # pragma: allowlist secret
  password: sandbox-password-123 # pragma: allowlist secret
  host: postgres.krypton-test.svc # pragma: allowlist secret
---
apiVersion: v1
kind: Secret
metadata:
  name: feature-flags
  namespace: krypton-test
  annotations:
    krypton.io/managed-by: krypton
    krypton.io/version: '1'
    krypton.io/description: Non-sensitive flags; open to all authenticated users
  labels:
    app.kubernetes.io/part-of: krypton-sandbox
type: Opaque
stringData:
  new-checkout: 'true'
  dark-mode: 'false'
---
apiVersion: v1
kind: Secret
metadata:
  name: legacy-external
  namespace: krypton-test
  labels:
    app.kubernetes.io/part-of: krypton-sandbox
type: Opaque
stringData:
  token: legacy-token-abc # pragma: allowlist secret
---
apiVersion: v1
kind: Secret
metadata:
  name: frontend-api-keys
  namespace: frontend-ns
  annotations:
    krypton.io/managed-by: krypton
    krypton.io/version: '1'
    krypton.io/description: Governed by namespace fallback (no secret-level rules)
  labels:
    app.kubernetes.io/part-of: krypton-sandbox
type: Opaque
stringData:
  maps-key: fk-sandbox-001 # pragma: allowlist secret
  analytics-key: fk-sandbox-002 # pragma: allowlist secret
